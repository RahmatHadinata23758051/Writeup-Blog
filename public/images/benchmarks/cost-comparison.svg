<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perbandingan biaya API per kompetisi CTF">
  <title>Biaya API per Kompetisi CTF</title>
  <desc>Perbandingan biaya USD untuk menyelesaikan 30 challenge CTF menggunakan Claude Opus 5, Claude Sonnet 5, GPT-5.4, GPT-5.4-mini, Kimi K3, dan Kimi K2.7 Code</desc>

  <defs>
    <!-- Linear brand indigo gradients -->
    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e6ad2"/>
      <stop offset="100%" stop-color="#7170ff"/>
    </linearGradient>
    <linearGradient id="bar-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7170ff"/>
      <stop offset="100%" stop-color="#828fff"/>
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar-rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>

    <!-- Bar hover glow -->
    <filter id="bar-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#7170ff" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bar { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
    .bar:hover { filter: url(#bar-glow); }
    .bar:hover .bar-fill { opacity: 1; }
    .bar-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .bar-value { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .axis-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 590; letter-spacing: -0.24px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
  </style>

  <!-- Background card -->
  <rect x="0" y="0" width="560" height="400" rx="12" fill="#191a1b" filter="url(#card-shadow)"/>
  <rect x="0" y="0" width="560" height="400" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Title area -->
  <text x="24" y="32" class="title" fill="#f7f8f8" font-size="15">Biaya API per Kompetisi CTF</text>
  <text x="24" y="50" class="subtitle" fill="#8a8f98" font-size="11">30 challenge · agen otonom · tanpa batch API</text>

  <!-- Divider -->
  <line x1="24" y1="62" x2="536" y2="62" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Y-axis labels (model names) -->
  <!-- Row 1 -->
  <text x="24" y="96" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">Kimi K2.7 Code</text>
  <text x="24" y="110" class="axis-label" fill="#62666d" font-size="10">hemat</text>

  <!-- Row 2 -->
  <text x="24" y="138" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">GPT-5.4-mini</text>
  <text x="24" y="152" class="axis-label" fill="#62666d" font-size="10">hemat</text>

  <!-- Row 3 -->
  <text x="24" y="176" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">Kimi K3</text>
  <text x="24" y="190" class="axis-label" fill="#22d3ee" font-size="10">cache 80%</text>

  <!-- Row 4 -->
  <text x="24" y="214" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">Claude Sonnet 5</text>
  <text x="24" y="228" class="axis-label" fill="#62666d" font-size="10">balanced</text>

  <!-- Row 5 -->
  <text x="24" y="252" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">GPT-5.4</text>
  <text x="24" y="266" class="axis-label" fill="#62666d" font-size="10">flagship</text>

  <!-- Row 6 -->
  <text x="24" y="290" class="axis-label" fill="#d0d6e0" font-size="12" font-weight="500">Claude Opus 5</text>
  <text x="24" y="304" class="axis-label" fill="#62666d" font-size="10">flagship</text>

  <!-- Bar backgrounds (track) -->
  <rect x="150" y="82" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="150" y="124" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="150" y="166" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="150" y="208" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="150" y="250" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="150" y="292" width="340" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>

  <!-- Bar fills — width = (cost / 99) * 340 -->
  <!-- Kimi K2.7 Code: 13.34 / 99 * 340 = ~46px -->
  <rect class="bar" x="150" y="82" width="46" height="28" rx="4" fill="url(#bar-cyan)" opacity="0.9"/>
  <!-- GPT-5.4-mini: 16.02 / 99 * 340 = ~55px -->
  <rect class="bar" x="150" y="124" width="55" height="28" rx="4" fill="url(#bar-violet)" opacity="0.9"/>
  <!-- Kimi K3 cache: 33.48 / 99 * 340 = ~115px -->
  <rect class="bar" x="150" y="166" width="115" height="28" rx="4" fill="url(#bar-cyan)" opacity="0.85"/>
  <!-- Claude Sonnet 5: 39.60 / 99 * 340 = ~136px -->
  <rect class="bar" x="150" y="208" width="136" height="28" rx="4" fill="url(#bar-blue)" opacity="0.9"/>
  <!-- GPT-5.4: 53.40 / 99 * 340 = ~183px -->
  <rect class="bar" x="150" y="250" width="183" height="28" rx="4" fill="url(#bar-violet)" opacity="0.9"/>
  <!-- Claude Opus 5: 99.00 / 99 * 340 = 340px -->
  <rect class="bar" x="150" y="292" width="340" height="28" rx="4" fill="url(#bar-blue)" opacity="0.85"/>

  <!-- Value labels (right of bar) -->
  <text x="200" y="101" class="bar-value" fill="#f7f8f8" font-size="12" fill-opacity="0.7">$13.34</text>
  <text x="210" y="143" class="bar-value" fill="#f7f8f8" font-size="12" fill-opacity="0.7">$16.02</text>
  <text x="270" y="185" class="bar-value" fill="#22d3ee" font-size="12" fill-opacity="0.9">$33.48</text>
  <text x="292" y="227" class="bar-value" fill="#f7f8f8" font-size="12" fill-opacity="0.7">$39.60</text>
  <text x="340" y="269" class="bar-value" fill="#f7f8f8" font-size="12" fill-opacity="0.7">$53.40</text>
  <text x="496" y="311" class="bar-value" fill="#7170ff" font-size="12" fill-opacity="0.9">$99.00</text>

  <!-- X-axis gridlines -->
  <line x1="150" y1="328" x2="490" y2="328" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="150" y1="290" x2="490" y2="290" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="150" y1="250" x2="490" y2="250" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="150" y1="208" x2="490" y2="208" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="150" y1="166" x2="490" y2="166" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="150" y1="124" x2="490" y2="124" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="150" y1="82" x2="490" y2="82" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- X-axis labels -->
  <text x="150" y="344" class="axis-label" fill="#62666d" font-size="10" text-anchor="middle">$0</text>
  <text x="235" y="344" class="axis-label" fill="#62666d" font-size="10" text-anchor="middle">$25</text>
  <text x="320" y="344" class="axis-label" fill="#62666d" font-size="10" text-anchor="middle">$50</text>
  <text x="405" y="344" class="axis-label" fill="#62666d" font-size="10" text-anchor="middle">$75</text>
  <text x="490" y="344" class="axis-label" fill="#62666d" font-size="10" text-anchor="middle">$100</text>

  <!-- X-axis label -->
  <text x="320" y="362" class="axis-label" fill="#8a8f98" font-size="10" text-anchor="middle">Biaya Total (USD)</text>

  <!-- Legend -->
  <g transform="translate(24, 374)">
    <!-- Claude -->
    <rect x="0" y="0" width="10" height="10" rx="2" fill="url(#bar-blue)"/>
    <text x="14" y="9" class="axis-label" fill="#8a8f98" font-size="10">Anthropic</text>
    <!-- OpenAI -->
    <rect x="100" y="0" width="10" height="10" rx="2" fill="url(#bar-violet)"/>
    <text x="114" y="9" class="axis-label" fill="#8a8f98" font-size="10">OpenAI</text>
    <!-- Kimi -->
    <rect x="200" y="0" width="10" height="10" rx="2" fill="url(#bar-cyan)"/>
    <text x="214" y="9" class="axis-label" fill="#8a8f98" font-size="10">Kimi / Moonshot</text>
  </g>
</svg>